<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              light: '#6366f1',
              dark: '#818cf8',
            },
            secondary: {
              light: '#e0e7ff',
              dark: '#312e81',
            },
          },
          maxWidth: {
            'card-mobile': '360px',
            'card-tablet': '400px',
            'card-desktop': '440px',
          },
        },
      },
    }
  </script>
  <style>
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .card {
      transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
    }
    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-primary: #6366f1;
      --accent-secondary: #e0e7ff;
      --border: #e2e8f0;
      --shadow-card: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-hover: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
    .dark {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-primary: #818cf8;
      --accent-secondary: #312e81;
      --border: #334155;
      --shadow-card: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      --shadow-hover: 0 20px 25px -5px rgb(0 0 0 / 0.4);
    }
    .dark .card {
      box-shadow: var(--shadow-card);
    }
    .dark .card:hover {
      box-shadow: var(--shadow-hover);
    }
    .tag {
      transition: background-color 0.2s ease, color 0.2s ease;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 transition-colors duration-300" style="background-color: var(--bg-primary);">
  
  <!-- Theme Toggle (top-right) -->
  <button 
    id="theme-toggle"
    class="absolute top-4 right-4 p-2 rounded-full transition-colors"
    style="background-color: var(--accent-secondary); color: var(--accent-primary);"
    aria-label="Toggle dark mode"
  >
    <!-- Sun Icon (light mode) -->
    <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
    </svg>
    <!-- Moon Icon (dark mode) -->
    <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
    </svg>
  </button>
  
  <!-- Profile Card -->
  <div class="card rounded-2xl overflow-hidden w-full max-w-card-mobile md:max-w-card-tablet lg:max-w-card-desktop" style="background-color: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-card);">
    
    <!-- Pet Image -->
    <div class="relative h-56">
      <img 
        src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&h=400&fit=crop" 
        alt="Mochi the cat" 
        class="w-full h-full object-cover"
      >
    </div>
    
    <!-- Pet Info -->
    <div class="p-6">
      <!-- Name, Breed, Age -->
      <div class="text-center mb-5">
        <h1 class="text-2xl font-bold mb-1" style="color: var(--text-primary); font-family: system-ui, sans-serif;">Mochi</h1>
        <p class="text-base mb-2" style="color: var(--text-secondary); font-family: system-ui, sans-serif;">Scottish Fold</p>
        <span class="inline-block px-3 py-1 rounded-full text-sm font-medium text-white" style="background-color: var(--accent-primary);">3 years old</span>
      </div>
      
      <!-- Personality Tags -->
      <div class="mb-5">
        <h2 class="text-xs font-medium uppercase tracking-wider mb-3" style="color: var(--text-secondary); font-family: system-ui, sans-serif;">Personality</h2>
        <div class="flex flex-wrap gap-2 justify-center">
          <span class="tag px-3 py-1 rounded-full text-sm font-medium" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Gentle</span>
          <span class="tag px-3 py-1 rounded-full text-sm font-medium" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Curious</span>
          <span class="tag px-3 py-1 rounded-full text-sm font-medium" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Playful</span>
          <span class="tag px-3 py-1 rounded-full text-sm font-medium" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Cuddly</span>
        </div>
      </div>
      
      <!-- Interests -->
      <div>
        <h2 class="text-xs font-medium uppercase tracking-wider mb-3" style="color: var(--text-secondary); font-family: system-ui, sans-serif;">Interests</h2>
        <div class="flex flex-wrap gap-2 justify-center">
          <span class="tag px-3 py-1 rounded-full text-sm" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Napping ☀️</span>
          <span class="tag px-3 py-1 rounded-full text-sm" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Chasing Laser 🧶</span>
          <span class="tag px-3 py-1 rounded-full text-sm" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Window Watching 🪟</span>
          <span class="tag px-3 py-1 rounded-full text-sm" style="background-color: var(--accent-secondary); color: var(--accent-primary);">Treats 🍖</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const html = document.documentElement;
    
    // Check localStorage for theme preference
    const savedTheme = localStorage.getItem('pet-profile-theme');
    
    // Apply saved theme on page load
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    } else {
      html.classList.remove('dark');
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }
    
    // Toggle theme on button click
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      
      const isDark = html.classList.contains('dark');
      localStorage.setItem('pet-profile-theme', isDark ? 'dark' : 'light');
      
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
