<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'bounce-short': 'bounce 0.5s ease-out',
          },
        },
      },
    }
  </script>
  <style>
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .dark .card:hover {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .tag {
      transition: background-color 0.2s ease, color 0.2s ease;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
  
  <div class="card bg-white dark:bg-gray-800 rounded-3xl shadow-xl overflow-hidden max-w-sm w-full">
    <!-- Pet Photo -->
    <div class="relative h-48 bg-gradient-to-br from-amber-400 to-orange-500 dark:from-gray-700 dark:to-gray-600">
      <img 
        src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&h=400&fit=crop" 
        alt="Cute cat" 
        class="w-full h-full object-cover"
      >
      <!-- Theme Toggle Button -->
      <button 
        id="theme-toggle"
        class="absolute top-4 right-4 p-2 rounded-full bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-colors"
        aria-label="Toggle dark mode"
      >
        <!-- Sun Icon -->
        <svg id="sun-icon" class="w-6 h-6 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <!-- Moon Icon -->
        <svg id="moon-icon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>
    </div>
    
    <!-- Pet Info -->
    <div class="p-6">
      <div class="text-center mb-4">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">Mochi</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">British Shorthair • 3 years old</p>
      </div>
      
      <!-- Personality -->
      <div class="mb-4">
        <h2 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Personality</h2>
        <div class="flex flex-wrap gap-2 justify-center">
          <span class="tag px-3 py-1 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 rounded-full text-sm font-medium">Curious</span>
          <span class="tag px-3 py-1 bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 rounded-full text-sm font-medium">Playful</span>
          <span class="tag px-3 py-1 bg-pink-100 dark:bg-pink-900/30 text-pink-700 dark:text-pink-300 rounded-full text-sm font-medium">Cuddly</span>
        </div>
      </div>
      
      <!-- Hobbies -->
      <div>
        <h2 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Hobbies</h2>
        <div class="flex flex-wrap gap-2 justify-center">
          <span class="tag px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 rounded-full text-sm">Chasing toys</span>
          <span class="tag px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-full text-sm">Napping</span>
          <span class="tag px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-full text-sm">Bird watching</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const html = document.documentElement;
    
    // Check localStorage for theme preference
    const savedTheme = localStorage.getItem('pet-profile-theme');
    
    // Apply saved theme on page load
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      sunIcon.classList.remove('hidden');
      moonIcon.classList.add('hidden');
    } else {
      html.classList.remove('dark');
      sunIcon.classList.add('hidden');
      moonIcon.classList.remove('hidden');
    }
    
    // Toggle theme on button click
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      
      const isDark = html.classList.contains('dark');
      localStorage.setItem('pet-profile-theme', isDark ? 'dark' : 'light');
      
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
